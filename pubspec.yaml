name: quran_data_kit

description: A comprehensive, offline Flutter package for the Holy Quran.
  Provides QCF Tajweed font rendering, rich Quran metadata (Surah, Juz, page,
  verse), translations, audio URLs, Sajdah data, reciters, and Arabic text
  utilities — all in one professionally structured library.

version: 1.0.0

homepage: https://github.com/mahmoud123-karash/quran_data_kit

environment:
  sdk: ^3.7.0
  flutter: ">=3.0.0"

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/fonts/
    - assets/surah_banner.png

  fonts:
    - family: "arsura"
      fonts:
        - asset: assets/fonts/arsura.ttf
    - family: "hafs"
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
    - family: "QCF4_BSML"
      fonts:
        - asset: assets/fonts/QCF4_BSML.ttf
