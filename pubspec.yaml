name: quran_data_kit
description: A comprehensive Flutter package for the Holy Quran with QCF Tajweed
  font rendering, rich metadata, 16 translations, audio URLs, and Arabic text
  utilities.
version: 1.0.2
homepage: https://github.com/mahmoud123-karash/quran_data_kit
repository: https://github.com/mahmoud123-karash/quran_data_kit
issue_tracker: https://github.com/mahmoud123-karash/quran_data_kit/issues

topics:
  - quran
  - islam
  - arabic
  - tajweed
  - mushaf

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/
    - assets/surah_banner.png

  fonts:
    - family: "arsura"
      fonts:
        - asset: assets/fonts/arsura.ttf
    - family: "hafs"
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
    - family: "QCF4_BSML"
      fonts:
        - asset: assets/fonts/QCF4_BSML.ttf
